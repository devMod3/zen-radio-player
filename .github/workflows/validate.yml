name: Validate Zen Radio Player

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize script permissions
        run: chmod +x scripts/*.sh
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Public embed contract tests
        run: node --test $(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'rendered-html.test.mjs' -print)
      - name: Build GitHub Pages embed
        run: npm run build:pages
